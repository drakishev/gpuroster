name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check gpuroster/static/dashboard.js
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - run: git diff --exit-code -- gpuroster/static
      - run: npm audit
      - run: bash -n start.sh
      - run: git diff --check
      - name: Validate systemd unit syntax without installing a service
        run: |
          sed 's|ExecStart=/opt/gpuroster/venv/bin/gpuroster|ExecStart=/usr/bin/true|' deploy/gpuroster.service > "$RUNNER_TEMP/gpuroster.service"
          systemd-analyze verify "$RUNNER_TEMP/gpuroster.service"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/browser -v

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/gpuroster-install"
          "$RUNNER_TEMP/gpuroster-install/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/gpuroster-install/bin/python" -m pip check
      - name: Test installed launcher outside checkout without GPU tools
        run: python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-install/bin/gpuroster"
      - name: Test installed synthetic demo without host monitoring or persistent state
        run: python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-install/bin/gpuroster" --demo
