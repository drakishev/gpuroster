name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock -r requirements/dev.lock"
      - run: python -m pip check
      - run: python scripts/lock_dependencies.py --check
      - run: python -m unittest discover -s tests/packaging -v
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check gpuroster/static/dashboard.js
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - run: git diff --exit-code -- gpuroster/static
      - run: npm audit
      - run: bash -n start.sh
      - run: git diff --check
      - name: Validate systemd unit syntax without installing a service
        run: |
          sed 's|ExecStart=/opt/gpuroster/venv/bin/gpuroster|ExecStart=/usr/bin/true|' deploy/gpuroster.service > "$RUNNER_TEMP/gpuroster.service"
          systemd-analyze verify "$RUNNER_TEMP/gpuroster.service"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/runtime.lock
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.lock"
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/dev.lock"
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/browser -v

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/audit.lock"
      - run: pip-audit --require-hashes -r requirements/runtime.lock

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock"
      - run: python -m build --no-isolation
      - run: python -m unittest discover -s tests/packaging -v
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/gpuroster-install"
          "$RUNNER_TEMP/gpuroster-install/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements/runtime.lock
          "$RUNNER_TEMP/gpuroster-install/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/gpuroster-install/bin/python" -m pip check
      - name: Test installed launcher outside checkout without GPU tools
        run: python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-install/bin/gpuroster"
      - name: Test installed synthetic demo without host monitoring or persistent state
        run: python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-install/bin/gpuroster" --demo

  compatibility:
    name: Latest compatible runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Deliberately exercise the published compatibility ranges, separately
      # from the locked environments used for deployment and artifact builds.
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  containers:
    name: Docker build and deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose version
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: Check that private files cannot enter the build context
        run: python3 -m scripts.check_container_context
      - run: docker build --tag gpuroster:ci .
      - name: Test demo and unavailable-GPU deployment without NVIDIA hardware
        run: python3 -m scripts.smoke_container --image gpuroster:ci

  artifacts:
    name: Reproducible release bundle
    needs: [quality, backend, browser, dependencies, packaging, compatibility, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: "python -m pip install --require-hashes --only-binary=:all: -r requirements/build.lock"
      - name: Compare two clean builds from this commit
        run: python scripts/build_release.py
      - name: Verify bundle checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Test the exact release wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/gpuroster-release"
          "$RUNNER_TEMP/gpuroster-release/bin/python" -m pip install --require-hashes --only-binary=:all: -r dist/release/runtime.lock
          "$RUNNER_TEMP/gpuroster-release/bin/python" -m pip install --no-deps dist/release/*.whl
          "$RUNNER_TEMP/gpuroster-release/bin/python" -m pip check
          python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-release/bin/gpuroster"
          python scripts/smoke_install.py "$RUNNER_TEMP/gpuroster-release/bin/gpuroster" --demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpuroster-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
