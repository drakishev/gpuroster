[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuroster"
version = "0.5.0"
description = "A shared GPU monitoring dashboard with bounded collection and SQLite history"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/drakishev/gpuroster"

[project.scripts]
gpuroster = "gpuroster.server:main"

[tool.setuptools]
packages = ["gpuroster", "gpuroster.monitoring"]
include-package-data = false

[tool.setuptools.package-data]
gpuroster = ["templates/*.html", "static/*.js", "static/*.css", "static/vendor/*.js", "static/vendor/*.txt"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
target-version = "py310"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
